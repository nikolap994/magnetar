name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security vulnerabilities must not be reported here** - see [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Magnetar version
      description: Output of `magnetar --version`
      placeholder: "magnetar 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `magnetar.log` (Linux: `~/.local/share/magnetar/`, Windows: `%AppData%\magnetar\`).
        Please remove anything private such as torrent names or IP addresses.
      render: text
