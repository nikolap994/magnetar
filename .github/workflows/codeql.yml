name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Vendored third-party library (see third_party/README.md).
          config: |
            paths-ignore:
              - third_party
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results
      # Report Magnetar's own code only: third_party/ holds the vendored
      # upstream torrent library (see third_party/README.md), whose findings
      # belong upstream (e.g. RC4, required by BitTorrent protocol encryption).
      # Path filters do not apply to Go analysis, so the results are filtered.
      - uses: advanced-security/filter-sarif@v1.1
        with:
          patterns: |
            -third_party/**
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}
