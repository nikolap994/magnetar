name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "tools/sitegen/**", "docs/screenshot-*.png", "assets/logo.svg", ".github/workflows/pages.yml"]
  # The release workflow starts this after publishing a release, so the site
  # always shows the newest version and its notes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): the
  # artifact is fully registered before the deploy job looks it up.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshot-*.png _site/screenshots/
          cp assets/logo.svg _site/
          go run ./tools/sitegen -changelog CHANGELOG.md -page _site/index.html -changelog-page _site/changelog.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
