name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore keyless signing + attestations
      attestations: write    # build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - uses: sigstore/cosign-installer@v3

      - name: Sign checksums (Sigstore keyless)
        run: cosign sign-blob --yes dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          cat > notes.md <<NOTES
          ${notes}

          ## Downloads
          | Platform | File |
          | --- | --- |
          | **Windows** (installer, recommended) | \`magnetar_${version}_windows_amd64_setup.exe\` |
          | Windows (portable) | \`magnetar_${version}_windows_amd64.zip\` |
          | **Ubuntu / Debian** | \`magnetar_${version}_amd64.deb\` |
          | Linux (portable) | \`magnetar_${version}_linux_amd64.tar.gz\` |

          ARM64 builds are included for every platform.

          ## Verify
          \`\`\`sh
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          See [docs/SIGNING.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/SIGNING.md).
          NOTES
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Magnetar ${version}" --notes-file notes.md $prerelease
