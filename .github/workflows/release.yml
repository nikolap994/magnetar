name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore keyless signing + attestations
      attestations: write    # build provenance
      actions: read          # SignPath reads the uploaded artifacts
    env:
      UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check release configuration
        run: |
          if [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is not set"; exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: go test -count=1 ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build binaries
        run: make clean winres binaries VERSION="$version"

      # ---- Windows Authenticode signing (enabled once SignPath is configured) ----
      - name: Upload unsigned Windows binaries
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: dist/bin/windows_*/magnetar.exe
      - name: Sign Windows binaries (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/bin

      - name: Build packages and installers
        run: make archives deb installer source-archive VERSION="$version"

      - name: Upload unsigned installers
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/*_setup.exe
      - name: Sign installers (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Write checksums
        run: make checksums VERSION="$version"

      - name: Sign checksums for the in-app updater (Ed25519)
        env:
          MAGNETAR_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$MAGNETAR_UPDATE_KEY" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is not set"; exit 1
          fi
          make sign-checksums
          go run ./tools/signsums verify "$UPDATE_PUBLIC_KEY" dist/SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      - name: Sign checksums (Sigstore keyless)
        run: cosign sign-blob --yes dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(awk -v v="$version" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          cat > notes.md <<NOTES
          ${notes}

          ## Downloads
          | Platform | File |
          | --- | --- |
          | **Windows** (installer, recommended) | \`magnetar_${version}_windows_amd64_setup.exe\` |
          | Windows (portable) | \`magnetar_${version}_windows_amd64.zip\` |
          | **Ubuntu / Debian** | \`magnetar_${version}_amd64.deb\` |
          | Linux (portable) | \`magnetar_${version}_linux_amd64.tar.gz\` |

          ARM64 builds are included for every platform. Magnetar 0.2.0 and later update themselves from these files.

          ## Verify
          \`\`\`sh
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          See [Verify your download](https://github.com/${GITHUB_REPOSITORY}#verify-your-download).
          NOTES
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Magnetar ${version}" --notes-file notes.md $prerelease

  # Publishes the server/NAS image to GitHub Container Registry (amd64, arm64).
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Rebuilds the website so it shows the new version and its release notes.
  # It runs from main (the github-pages environment only deploys main); the
  # release commit there already carries the changelog section.
  website:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Opens a pull request on microsoft/winget-pkgs for every new release.
  # Runs when the WINGET_ENABLED variable is set:
  # repository variable WINGET_ENABLED=true and secret WINGET_TOKEN (classic PAT, public_repo).
  winget:
    needs: release
    if: ${{ vars.WINGET_ENABLED == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NikolaPavlovic.Magnetar
          installers-regex: '_setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
